name: CI

on:
  push:
    branches: [main, "revival/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: npx next build